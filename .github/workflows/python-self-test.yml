name: CI

# Required checks must always be reported, including docs-only PRs.
# No push-to-main trigger: validation runs on PRs and manual dispatch only.
on:
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python client
        run: python -m compileall -q aeon_mud_client.py aeon_mud
      - name: Run built-in regression tests
        run: python aeon_mud_client.py self-test
      - name: Run loopback integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify independent infrastructure imports
        run: |
          python -c "import aeon_mud.config, aeon_mud.profiles, aeon_mud.security, aeon_mud.telnet, aeon_mud.transport, aeon_mud.terminal_text, aeon_mud.transcript, aeon_mud.input, aeon_mud.terminal, aeon_mud.commands, aeon_mud.session"
      - name: Verify package entry point
        run: python -m aeon_mud self-test
      - name: Build wheel and verify installed console entry point
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --no-isolation
          python -m pip install dist/*.whl
          aeon-mud self-test

  windows-terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify PowerShell launcher syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "aeon-mud.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) { throw "PowerShell launcher syntax errors: $errors" }
      - name: Verify plain Windows entry points and nested CLI help
        shell: powershell
        run: |
          $cases = @(
            @{ Args = @("-h"); Usage = "usage: aeon_mud_client.py [-h]" },
            @{ Args = @("help"); Usage = "usage: aeon_mud_client.py [-h]" },
            @{ Args = @("-h", "connect"); Usage = "usage: aeon_mud_client.py connect" },
            @{ Args = @("connect", "help"); Usage = "usage: aeon_mud_client.py connect" },
            @{ Args = @("help", "profile", "list"); Usage = "usage: aeon_mud_client.py profile list" },
            @{ Args = @("secret", "set", "help"); Usage = "usage: aeon_mud_client.py secret set" }
          )
          foreach ($case in $cases) {
            $arguments = [string[]]$case.Args
            $batch = & ".\aeon-mud.bat" @arguments 2>&1 | Out-String
            $batchCode = $LASTEXITCODE
            $script = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\aeon-mud.ps1" @arguments 2>&1 | Out-String
            $scriptCode = $LASTEXITCODE
            if ($batchCode -ne 0 -or $scriptCode -ne 0) {
              throw "Help exit codes differed: batch=$batchCode PowerShell=$scriptCode"
            }
            if (-not $batch.Contains($case.Usage) -or -not $script.Contains($case.Usage)) {
              throw "Expected help $($case.Usage) from both launchers"
            }
          }
      - name: Run Windows self-test through both launchers
        shell: powershell
        run: |
          & ".\aeon-mud.bat" self-test
          if ($LASTEXITCODE -ne 0) { throw "Batch self-test failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\aeon-mud.ps1" self-test
          if ($LASTEXITCODE -ne 0) { throw "PowerShell self-test failed" }
      - name: Ensure obsolete launchers do not return
        shell: powershell
        run: |
          if (Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Name -match 'wezterm|AeonMud.Launcher.csproj' }) {
            throw "Obsolete Windows GUI launcher files present"
          }

  rust-console:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint native console
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --all-targets
      - name: Build standalone Windows console executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = ".\target\x86_64-pc-windows-msvc\release\aeon-mud.exe"
          if (-not (Test-Path $exe)) { throw "Rust console EXE is missing" }
          $result = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $result -notmatch "Rust console prototype") { throw "Native version smoke test failed: $result" }
          $result = & $exe self-test
          if ($LASTEXITCODE -ne 0 -or $result -notmatch "self-test passed") { throw "Native self-test failed: $result" }
          $result = & $exe --help
          if ($LASTEXITCODE -ne 0 -or $result -notmatch "Usage: aeon-mud") { throw "Native help failed: $result" }
      - name: Publish native Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: aeon-mud-rust-windows-x64
          path: rust/target/x86_64-pc-windows-msvc/release/aeon-mud.exe
          if-no-files-found: error

  required-check:
    name: CI
    runs-on: ubuntu-latest
    needs: [self-test, windows-terminal, rust-console]
    if: ${{ always() }}
    steps:
      - name: Verify required jobs succeeded
        env:
          PYTHON_RESULT: ${{ needs.self-test.result }}
          WINDOWS_RESULT: ${{ needs.windows-terminal.result }}
          RUST_RESULT: ${{ needs.rust-console.result }}
        run: |
          echo "Python: ${PYTHON_RESULT}"
          echo "Windows: ${WINDOWS_RESULT}"
          echo "Rust: ${RUST_RESULT}"
          if [[ "${PYTHON_RESULT}" != "success" || "${WINDOWS_RESULT}" != "success" || "${RUST_RESULT}" != "success" ]]; then
            echo "::error::All required jobs must succeed; failure, cancellation and skipped results are blocking."
            exit 1
          fi
          echo "All Aeon MUD checks passed."
