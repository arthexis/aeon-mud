name: Python self-test

on:
  pull_request:
    paths:
      - "aeon_mud_client.py"
      - "aeon_mud/**"
      - "pyproject.toml"
      - "tests/**"
      - "aeon-mud-wezterm.ps1"
      - "aeon-mud-wezterm.lua"
      - "aeon-mud-wezterm-session.ps1"
      - "aeon-mud-wezterm.bat"
      - "README.md"
      - ".github/workflows/python-self-test.yml"
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python client
        run: python -m compileall -q aeon_mud_client.py aeon_mud
      - name: Run built-in regression tests
        run: python aeon_mud_client.py self-test
      - name: Run loopback integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify independent infrastructure imports
        run: |
          python -c "import aeon_mud.config, aeon_mud.profiles, aeon_mud.security, aeon_mud.telnet, aeon_mud.transport, aeon_mud.terminal_text, aeon_mud.transcript, aeon_mud.input, aeon_mud.terminal, aeon_mud.commands, aeon_mud.session"
      - name: Verify package entry point
        run: python -m aeon_mud self-test
      - name: Build wheel and verify installed console entry point
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --no-isolation
          python -m pip install dist/*.whl
          aeon-mud self-test

  wezterm-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate launcher syntax and usage
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "aeon-mud-wezterm.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw "PowerShell launcher has syntax errors: $parseErrors"
          }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "aeon-mud-wezterm-session.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw "PowerShell session wrapper has syntax errors: $parseErrors"
          }
          $usage = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\aeon-mud-wezterm.ps1" 2>&1
          $launcherCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host "Launcher exit: $launcherCode; output: $usage"
          if ($launcherCode -ne 2) {
            throw "Expected usage exit code 2, got $launcherCode"
          }
          if (-not ($usage -match "Usage:")) {
            throw "Expected usage instructions from launcher"
          }
      - name: Plain and WezTerm launchers share nested help in existing shell
        shell: powershell
        run: |
          # A bad WezTerm path must have no effect on help handling.
          $env:AEON_WEZTERM_PATH = Join-Path $env:RUNNER_TEMP "missing-wezterm.exe"
          $cases = @(
            @{ Args = @("-h"); Usage = "usage: aeon_mud_client.py [-h]" },
            @{ Args = @("--help"); Usage = "usage: aeon_mud_client.py [-h]" },
            @{ Args = @("help"); Usage = "usage: aeon_mud_client.py [-h]" },
            @{ Args = @("-h", "connect"); Usage = "usage: aeon_mud_client.py connect" },
            @{ Args = @("connect", "help"); Usage = "usage: aeon_mud_client.py connect" },
            @{ Args = @("connect", "-h"); Usage = "usage: aeon_mud_client.py connect" },
            @{ Args = @("help", "profile", "list"); Usage = "usage: aeon_mud_client.py profile list" },
            @{ Args = @("profile", "list", "help"); Usage = "usage: aeon_mud_client.py profile list" },
            @{ Args = @("secret", "set", "help"); Usage = "usage: aeon_mud_client.py secret set" }
          )
          foreach ($case in $cases) {
            $arguments = [string[]]$case.Args
            $plain = & ".\\aeon-mud.bat" @arguments 2>&1 | Out-String
            $plainCode = $LASTEXITCODE
            $gui = & ".\\aeon-mud-wezterm.bat" @arguments 2>&1 | Out-String
            $guiCode = $LASTEXITCODE
            Write-Host "Case: $($case.Args -join ' ')"
            if ($plainCode -ne 0 -or $guiCode -ne 0) {
              throw "Both launchers must return 0 for help: plain=$plainCode gui=$guiCode"
            }
            if (-not $gui.Contains($case.Usage) -or -not $plain.Contains($case.Usage)) {
              throw "Expected targeted help $($case.Usage), got $gui"
            }
            if ($gui -match "Launching Aeon MUD in WezTerm|WezTerm was not found") {
              throw "Help must never launch or resolve WezTerm"
            }
          }
      - name: WezTerm applies Aeon-only clipboard shortcuts
        shell: powershell
        run: |
          $config = Get-Content ".\\aeon-mud-wezterm.lua" -Raw
          foreach ($required in @(
            "mods = 'CTRL', action = act.CopyTo 'Clipboard'",
            "mods = 'CTRL', action = act.SendString",
            "mods = 'CTRL|SHIFT', action = act.SendString",
            "mods = 'SHIFT', action = act.SendString"
          )) {
            if (-not $config.Contains($required)) {
              throw "Aeon WezTerm config missing shortcut: $required"
            }
          }
          # A fake wezterm executable records arguments without launching a GUI.
          $probe = Join-Path $env:RUNNER_TEMP "wezterm-args.cmd"
          Set-Content -LiteralPath $probe -Encoding ASCII -Value @(
            "@echo off",
            "echo WEZTERM_ARGS=%*"
          )
          $env:AEON_WEZTERM_PATH = $probe
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\\aeon-mud-wezterm.ps1" connect example 2>&1
          $code = $LASTEXITCODE
          $result = $output | Out-String
          Write-Host $result
          if ($code -ne 0 -or -not $result.Contains("--config-file") -or
              -not $result.Contains("aeon-mud-wezterm.lua") -or
              -not $result.Contains(" start --cwd")) {
            throw "WezTerm launcher did not load the Aeon shortcut config"
          }
      - name: Launcher reports executable failures
        shell: powershell
        run: |
          # Simulate a broken WezTerm executable without requiring a GUI runner.
          $env:AEON_WEZTERM_PATH = Join-Path $env:pythonLocation "python.exe"
          $ErrorActionPreference = "Continue"
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\aeon-mud-wezterm.ps1" connect example 2>&1
          $launchCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = "Stop"
          Write-Host "Simulated failed launch: $launchCode"
          Write-Host ($output | Out-String)
          if ($launchCode -eq 0) {
            throw "Expected the simulated failed executable to fail"
          }
          if (-not (($output | Out-String) -match "Launching Aeon MUD in WezTerm")) {
            throw "Launcher did not print its startup diagnostic"
          }
          if (-not (($output | Out-String) -match "exited with code|launch failed")) {
            throw "Launcher did not print a useful failure diagnostic"
          }
      - name: Session wrapper preserves errors and argument boundaries
        shell: powershell
        run: |
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $session = Join-Path $PWD "aeon-mud-wezterm-session.ps1"
          $probe = Join-Path $env:RUNNER_TEMP "aeon-mud-probe.py"
          Set-Content -LiteralPath $probe -Encoding ASCII -Value "import sys; print('PASSED_ARGS=' + repr(sys.argv[1:])); sys.exit(7 if '--exit-seven' in sys.argv else 0)"
          $env:AEON_MUD_PYTHON_PATH = $python
          $env:AEON_MUD_SCRIPT_PATH = $probe
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $session "two words" "--port" "2069" 2>&1
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $result = $output | Out-String
          Write-Host $result
          if ($code -ne 0 -or $result -notmatch "two words" -or $result -notmatch "2069" -or $result -notmatch "ended normally") {
            throw "Session wrapper failed to forward arguments"
          }
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $session "--exit-seven" 2>&1
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $result = $output | Out-String
          Write-Host $result
          if ($code -ne 0 -or $result -notmatch "exited with code 7") {
            throw "Session wrapper failed to preserve failure diagnostics"
          }
